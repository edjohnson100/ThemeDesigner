<!DOCTYPE html>
<html data-theme="dark">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Ornament Buddy</title>
</head>
<body>
    <div class="header">
        <div class="title-group">
            <h2>Ornament Buddy</h2>
            <div id="versionTag" class="sub-header"></div>
        </div>
        <select id="themeSelector" onchange="changeTheme()" style="width: auto; height: 28px; font-size: calc(var(--font-size-base) - 2px); padding: 2px 5px;">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="sepia">Sepia</option>
        </select>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-design')">Design</button>
        <button class="tab-btn" onclick="switchTab('tab-themes')">Themes</button>
    </div>

    <div id="tab-design" class="tab-content active">
        <form novalidate onsubmit="return false;">

            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="preview-checkbox">
                    <input type="checkbox" id="preview-checkbox" checked />
                    <div class="slider"></div>
                </label>
                <span class="toggle-label">Live Preview</span>
            </div>

            <div class="section">
                <div class="section-header"><h3>1. Personalization</h3></div>

                <div class="input-group-vert">
                    <label>Name (Text)</label>
                    <input type="text" id="nameInput" placeholder="Enter Name..." autocomplete="off">
                </div>
                <div class="input-group-vert">
                    <label>Font Height (mm)</label>
                    <input type="number" id="heightInput" value="10" step="0.5">
                </div>
            </div>

            <div class="section">
                <div class="section-header" style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>2. Style (BG Groups)</h3>
                    <button class="icon-btn" id="refreshBtn" title="Rescan Model">↻</button>
                </div>
                <div id="bgList" class="radio-list">
                    <div style="padding:10px; color:#888;">Scanning...</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header"><h3>3. Export</h3></div>

                <div class="folder-row">
                    <div id="folderPath" class="path-display">No folder selected</div>
                    <button id="browseBtn" class="secondary-btn">Browse</button>
                </div>

                <div class="format-row">
                    <label><input type="checkbox" value="stl" checked> STL</label>
                    <label><input type="checkbox" value="3mf"> 3MF</label>
                    <label><input type="checkbox" value="step"> STEP</label>
                </div>

                <div class="input-group-vert">
                     <label>Filename</label>
                     <input type="text" id="filenameInput" placeholder="Filename...">
                </div>

                <button id="exportBtn" class="primary-btn">EXPORT FILES</button>
            </div>
        </form>
    </div>

    <div id="tab-themes" class="tab-content">
        <div class="section" id="sec-theme-manager">
            <div class="section-header" tabindex="0" role="button" aria-expanded="true"
                 onclick="toggleSection('sec-theme-manager')"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSection('sec-theme-manager');}">
                <h3>Theme Manager</h3>
                <span class="arrow">▼</span>
            </div>
            <div class="section-content data-container">
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label>Font Family</label>
                        <select id="fontFamilySelector" onchange="updateActiveThemeProperty('--font-family', this.value)">
                            <option value="'Segoe UI', Tahoma, sans-serif">Sans-serif</option>
                            <option value="Georgia, 'Times New Roman', Times, serif">Serif</option>
                            <option value="'Consolas', 'Courier New', monospace">Monospace</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label>Base Font Size</label>
                        <select id="fontSizeSelector" onchange="updateActiveThemeProperty('--font-size-base', this.value)">
                            <option value="11px">11px</option><option value="12px">12px</option><option value="13px">13px</option>
                            <option value="14px">14px</option><option value="15px">15px</option><option value="16px">16px</option>
                            <option value="17px">17px</option><option value="18px">18px</option>
                        </select>
                    </div>
                </div>
                <p>Import custom themes via a JSON theme export or batch import custom style.css files.</p>
                <div class="create-grid">
                    <button class="btn-primary" onclick="requestImport('css')">📥 Import style.css</button>
                    <button class="btn-primary" onclick="requestExport('css')">📤 Export style.css</button>
                    <button class="btn-secondary" onclick="requestImport('json')">📂 Import .json</button>
                    <button class="btn-secondary" onclick="requestExport('json')">💾 Export .json</button>
                    <button id="themeRemoveBtn" class="btn-secondary full-width" onclick="removeSelectedTheme()" disabled title="Select a custom (imported) theme to enable">🗑️ Remove Selected Theme</button>
                    <button class="btn-secondary full-width" onclick="resetThemeCache()">🗑️ Factory Reset Theme Cache</button>
                </div>
            </div>
        </div>
    </div>

    <div class="version-footer">Ornament Buddy<br><span id="footerVersion"></span></div>

      <script src="../_common.js"></script>
  <script src="preview-shim.js"></script>
</body>
</html>
